name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: realtyos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d realtyos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/realtyos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Apply all database migrations to clean PostgreSQL
        run: npm run db:migrate
      - name: Verify tenant isolation constraints with real PostgreSQL writes\n        run: npm run db:test-integrity\n      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
